services:
  wg-easy:
    image: ${E2E_IMAGE:-wg-easy-e2e:local}
    environment:
      INSECURE: "true"
      EXPERIMENTAL_AWG: "true"
      OVERRIDE_AUTO_AWG: ${E2E_BACKEND:-wg}
      WG_ENDPOINT_RESOLUTION_RETRIES: "0"
      DISABLE_IPV6: ${E2E_DISABLE_IPV6:-true}
      DISABLE_VERSION_CHECK: "true"
      DEBUG: ""
      INIT_ENABLED: ${E2E_INITIALIZED:-true}
      INIT_USERNAME: e2e-admin
      INIT_PASSWORD: e2e-only-password-123!
      INIT_HOST: vpn.example.test
      INIT_PORT: "51820"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "${E2E_RP_FILTER:-0}"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      - "127.0.0.1::51821"
    networks:
      default:
        aliases:
          - vpn.example.test
    volumes:
      - wireguard:/etc/wireguard
      # No server process can execute a quick script, including on its first start.
      - /dev/null:/usr/bin/wg-quick:ro
      - /dev/null:/usr/bin/awg-quick:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ${E2E_BACKEND:-wg} show wg0 public-key >/dev/null &&
          node -e "fetch('http://127.0.0.1:51821/api/information').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  vpn-client:
    image: ${E2E_IMAGE:-wg-easy-e2e:local}
    command:
      - dumb-init
      - sh
      - -ec
      - |
        # Docker sets this sysctl before startup and mounts it read-only.
        test "$$(sysctl -n net.ipv4.conf.all.src_valid_mark)" = 1
        sed -i '/cmd sysctl -q net\.ipv4\.conf\.all\.src_valid_mark=1$/d' /usr/bin/awg-quick
        exec sleep infinity
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      disable: true

volumes:
  wireguard:
