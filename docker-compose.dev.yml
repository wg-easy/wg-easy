services:
  wg-easy:
    build:
      dockerfile: ./Dockerfile.dev
    command: dev
    tmpfs:
      - /app/.nuxt
    volumes:
      - /lib/modules:/lib/modules:ro
      # - ./data/:/etc/wireguard
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - INIT_ENABLED=true
      - INIT_HOST=test
      - INIT_PORT=51820
      - INIT_USERNAME=testtest
      - INIT_PASSWORD=Qweasdyxcv!2

    develop:
      watch:
        - action: sync
          path: ./src
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
            - coverage/
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
